name: Build, Scan, and Push Tor Bridge Images

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  WEBTUNNEL_VERSION: v0.0.5
  LYREBIRD_VERSION: 0.8.1

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        target: [obfs4, webtunnel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set transport version variable
        run: |
          if [ "${{ matrix.target }}" = "obfs4" ]; then
            echo "TRANSPORT_VER=lyrebird-${{ env.LYREBIRD_VERSION }}" >> $GITHUB_ENV
          else
            echo "TRANSPORT_VER=webtunnel-${{ env.WEBTUNNEL_VERSION }}" >> $GITHUB_ENV
          fi

      # Step 1: Build local image first (so we can inspect the installed package versions)
      - name: Build local container image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          pull: true # Ensures fresh upstream base image & APT cache check
          load: true # Loads into local Docker daemon for running commands & scanning
          build-args: |
            WEBTUNNEL_VERSION=${{ env.WEBTUNNEL_VERSION }}
            LYREBIRD_VERSION=${{ env.LYREBIRD_VERSION }}
          tags: local-tor-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Extract installed Tor daemon version from the built image
      - name: Extract installed Tor version
        run: |
          RAW_VER=$(docker run --rm local-tor-${{ matrix.target }}:${{ github.sha }} tor --version | head -n 1)
          # Parses "Tor version 0.4.8.12." -> "0.4.8.12"
          TOR_VER=$(echo "$RAW_VER" | awk '{print $3}' | sed 's/\.$//')
          echo "Detected Tor Version: $TOR_VER"
          echo "TOR_VER=${TOR_VER}" >> $GITHUB_ENV

      # Step 3: Run Trivy vulnerability scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'local-tor-${{ matrix.target }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 4: Generate OCI Labels & Metadata
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME_LOWER }}/tor-${{ matrix.target }}
          labels: |
            org.opencontainers.image.title=Tor Bridge (${{ matrix.target }})
            org.opencontainers.image.description=Tor bridge container image with ${{ matrix.target }} transport
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.torproject.tor.version=${{ env.TOR_VER }}
            org.torproject.transport.version=${{ env.TRANSPORT_VER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.TRANSPORT_VER }}
            type=sha,prefix=main-,format=short

      # Step 5: Push image to GHCR with OCI labels attached
      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          build-args: |
            WEBTUNNEL_VERSION=${{ env.WEBTUNNEL_VERSION }}
            LYREBIRD_VERSION=${{ env.LYREBIRD_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
